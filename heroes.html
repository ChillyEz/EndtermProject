<!DOCTYPE html>
<html lang="en">
<head>
    <title>Heroes | Dota 2 Wiki</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
    <script src="js/vendor/jquery-4.0.0.min.js"></script>
    <script src="script.js" type="module" defer></script>
</head>
<body>
    <noscript><p>This website needs JavaScript for its catalogs and interactive features. Please enable it in your browser.</p></noscript>
    <div class="page-shell">
<header>
    <a href="index.html" class="logo">
        <img src="images/icon.png" class="logo" alt="Dota 2 Wiki">
    </a>

    <button
        class="menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="main-navigation">
        ☰
    </button>
    
    <nav id="main-navigation" class="top-navbar" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="heroes.html" class ="active">Heroes</a>
        <a href="items.html">Items</a>
        <a href="map.html">Map</a>
        <a href="esports.html">Esports</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Light theme" aria-pressed="false" title="Switch to light theme">
        Theme: Dark
    </button>

    <a href="register.html" class="register-link">
        Register
    </a>
    <form class="page-search" role="search" novalidate>
        <label for="page-search-input">Search this page</label>
        <input id="page-search-input" type="search" placeholder="Find text on this page..." autocomplete="off" aria-describedby="page-search-status">
        <button type="submit">Find</button>
        <span id="page-search-status" role="status"></span>
    </form>
    </header>

<div class="overlay"></div>


    <main>
        <h1>Heroes</h1>
        <p class="hero-stat"><strong id="hero-total">0</strong> heroes in the database</p>
        <div class="hero-filters">

        <div class="hero-search-box">
            <input type="search" id="hero-search" placeholder="Search heroes..."
                aria-label="Search heroes" autocomplete="off"
                aria-controls="hero-suggestions" aria-expanded="false">
            <ul id="hero-suggestions" aria-label="Hero suggestions" hidden></ul>
        </div>

    <select id="attribute-filter" aria-label="Filter by attribute">
        <option value="All">All Attributes</option>
        <option value="Strength">Strength</option>
        <option value="Agility">Agility</option>
        <option value="Intelligence">Intelligence</option>
        <option value="Universal">Universal</option>
    </select>

    <select id="complexity-filter" aria-label="Filter by complexity">
        <option value="All">All Complexity</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>

    <select id="position-filter" aria-label="Filter by position">
        <option value="All">All Positions</option>
        <option value="Carry">1 — Carry</option>
        <option value="Mid">2 — Mid</option>
        <option value="Offlane">3 — Offlane</option>
        <option value="Soft Support">4 — Soft Support</option>
        <option value="Hard Support">5 — Hard Support</option>
    </select>

    <select id="attack-type-filter" aria-label="Filter by attack type">
        <option value="All">All Attack Types</option>
        <option value="Melee">Melee</option>
        <option value="Ranged">Ranged</option>
    </select>

        </div>
        <p id="hero-count" role="status"></p>
        <p class="pool-hint">Build your hero pool: save favourites here or from the <a href="index.html#hero-quiz">hero quiz</a>. <a href="profile.html">View my pool →</a></p>
        <p id="account-feedback" role="status"></p>
        <div id="hero-sections"></div>
    </main>
<footer>
    <p>&copy; 2026 Dota 2 Wiki. All rights reserved. Amir Baiseitov</p>
</footer>
</div>
</body>
</html>
