<!DOCTYPE html>
<html lang="en">
<head>
    <title>Items | Dota 2 Wiki</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="script.js"  type="module" defer></script>
    <script type="module" src="item-catalog.js"></script>
</head>
<body>
    <div class="page-shell">
    <header>
    <a href="index.html" class="logo">
        <img src="images/icon.png" class="logo" alt="Dota 2 Wiki">
    </a>

    <button
        class="menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="main-navigation">
        ☰
    </button>
    
    <nav id="main-navigation" class="top-navbar" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="heroes.html">Heroes</a>
        <a href="items.html" class ="active">Items</a>
        <a href="map.html">Map</a>
        <a href="esports.html">Esports</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Light theme" aria-pressed="false" title="Switch to light theme">
        Theme: Dark
    </button>

    <a href="register.html" class="register-link">
        Register
    </a>
    <form class="page-search" role="search" novalidate>
        <label for="page-search-input">Search this page</label>
        <input id="page-search-input" type="search" placeholder="Find text on this page..." autocomplete="off" aria-describedby="page-search-status">
        <button type="submit">Find</button>
        <span id="page-search-status" role="status"></span>
    </form>
    </header>

<div class="overlay"></div>
    
    <main>
        <h1>Items</h1>
        <div class="item-filters">
            <label for="item-purpose">What do you need?</label>
            <select id="item-purpose">
                <option value="">All items</option>
            </select>
            <span id="item-count" role="status"></span>
        </div>
        <div class="item-grid"></div>
        <template id="item-card-template">
            <article class="item-card">
                <div class="item-basic">
                    <h3 class="item-name"></h3>
                    <div class="item-image"><img alt=""></div>
                    <p class="item-description"></p>
                    <button class="item-button" type="button" aria-haspopup="dialog">View Details</button>
                </div>
            </article>
        </template>
        <dialog class="item-details" aria-labelledby="detail-name">
            <div class="item-details-header">
                <img class="detail-icon" alt="">
                <div>
                    <h3 id="detail-name"></h3>
                    <span class="item-cost"><img src="images/item-icons/gold.png" alt="Gold"><span></span></span>
                </div>
                <button class="close-item" type="button" aria-label="Close item details">×</button>
            </div>
            <div class="detail-body"></div>
        </dialog>
    </main>

<footer>

    <p>
        &copy; 2026 Dota 2 Wiki. All rights reserved. Amir Baiseitov
    </p>

</footer>
</div>




</html>
