<!DOCTYPE html>
<html lang="en">
<head>
    <title>Map | Dota 2 Wiki</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
    <script src="js/vendor/jquery-4.0.0.min.js"></script>
    <script src="script.js" type="module" defer></script>
</head>
<body>
    <noscript><p>This website needs JavaScript for its catalogs and interactive features. Please enable it in your browser.</p></noscript>
    <div class="page-shell">
<header>
    <a href="index.html" class="logo">
        <img src="images/icon.png" class="logo" alt="Dota 2 Wiki">
    </a>

    <button
        class="menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="main-navigation">
        ☰
    </button>
    
    <nav id="main-navigation" class="top-navbar" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="heroes.html">Heroes</a>
        <a href="items.html">Items</a>
        <a href="map.html" class="active" aria-current="page">Map</a>
        <a href="esports.html">Esports</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="Radiant light theme" aria-pressed="false" title="Switch to Radiant (light theme)">
        <span class="theme-side theme-radiant" aria-hidden="true"><span class="theme-emblem"></span>Radiant</span>
        <span class="theme-side theme-dire" aria-hidden="true"><span class="theme-emblem"></span>Dire</span>
    </button>

    <a href="register.html" class="register-link">
        Register
    </a>
    <form class="page-search" role="search" novalidate>
        <label for="page-search-input">Search this page</label>
        <input id="page-search-input" type="search" placeholder="Find text on this page..." autocomplete="off" aria-describedby="page-search-status">
        <button type="submit">Find</button>
        <span id="page-search-status" role="status"></span>
    </form>
    </header>

<div class="overlay"></div>
    <main>
        <h1>Dota 2 Map</h1>
        <p>Select a lane or base to learn its role in a match.</p>
        <div class="map-guide">
            <div class="map-container" id="lane-map">
                <img id="dota2-map" src="images/dota2_map.png" alt="Lane diagram with Radiant in the southwest and Dire in the northeast">
            </div>
            <section class="location-guide" aria-label="Location guide">
                <label for="map-location">Explore a location</label>
                <select id="map-location"></select>
                <div aria-live="polite">
                    <h2 id="location-title">Mid lane</h2>
                    <p id="location-description"></p>
                </div>
                <a href="images/dota2_map.png">Open the full diagram and legend</a>
            </section>
        </div>
    </main>
<footer>

</footer>
</div>
